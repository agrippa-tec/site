      <path d="M464.5 265.9 L514.7 78.5"/>
      <path d="M450 264 L450 70"/>
      <path d="M435.5 265.9 L385.3 78.5"/>
      <path d="M422 271.5 L325 103.5"/>
      <path d="M410.4 280.4 L273.2 143.2"/>
      <path d="M401.5 292 L233.5 195"/>
      <path d="M395.9 305.5 L208.5 255.3"/>
