    <g stroke-opacity=".28">
      <path d="M52 60 h16 M60 52 v16"/>
      <path d="M832 60 h16 M840 52 v16"/>
      <path d="M52 560 h16 M60 552 v16"/>
      <path d="M832 560 h16 M840 552 v16"/>
    </g>
