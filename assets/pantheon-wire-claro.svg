    <path d="M200 320 A250 250 0 0 1 700 320" stroke-opacity=".34"/>
    <path d="M245 320 A205 205 0 0 1 655 320" stroke-opacity=".17"/>
    <path d="M290 320 A160 160 0 0 1 610 320" stroke-opacity=".17"/>
    <path d="M335 320 A115 115 0 0 1 565 320" stroke-opacity=".15"/>
    <!-- raios da malha -->
    <g stroke-opacity=".13">
      <path d="M504.1 305.5 L691.5 255.3"/>
      <path d="M498.5 292 L666.5 195"/>
      <path d="M489.6 280.4 L626.8 143.2"/>
