  <!-- inscrição na arquitrave + cota do vão da cúpula -->
  <text x="450" y="228" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="14" letter-spacing="5" fill="#BA5C3A" fill-opacity=".55">M·AGRIPPA·FECIT</text>
  <g stroke="#BA5C3A" stroke-width="1.1" stroke-opacity=".45">
    <path d="M200 490 V518 M700 490 V518"/>
    <path d="M200 512 H700"/>
    <path d="M200 504 V520 M700 504 V520"/>
