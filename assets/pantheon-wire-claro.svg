      <path d="M267 232 h30 v14 h-30 z M273 246 v190 M291 246 v190 M268 436 h28 v8 h-28 z"/>
      <path d="M334 232 h30 v14 h-30 z M340 246 v190 M358 246 v190 M335 436 h28 v8 h-28 z"/>
      <path d="M401 232 h30 v14 h-30 z M407 246 v190 M425 246 v190 M402 436 h28 v8 h-28 z"/>
      <path d="M469 232 h30 v14 h-30 z M475 246 v190 M493 246 v190 M470 436 h28 v8 h-28 z"/>
      <path d="M536 232 h30 v14 h-30 z M542 246 v190 M560 246 v190 M537 436 h28 v8 h-28 z"/>
      <path d="M603 232 h30 v14 h-30 z M609 246 v190 M627 246 v190 M604 436 h28 v8 h-28 z"/>
      <path d="M670 232 h30 v14 h-30 z M676 246 v190 M694 246 v190 M671 436 h28 v8 h-28 z"/>
